<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PA Wrestling Almanac</title>
<meta name="description" content="Every Pennsylvania state wrestling champion and place winner since 1938, by school, district, weight and season.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Saira+Stencil+One&family=Saira:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root { --floor: #131416; --tile: #1b1e21; --tile-2: #23272b; --seam: #2e3439; --chalk: #eceef0; --chalk-2: #aab2ba; --chalk-3: #78818a; --stencil: "Saira Stencil One", "Arial Black", sans-serif; --body: "Saira", "Helvetica Neue", Arial, sans-serif; --w: 1180px; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--floor); color: var(--chalk); font: 15px/1.5 var(--body); }
a { color: var(--chalk); }
button { font: inherit; color: inherit; }
.btn { display: inline-grid; place-items: center; min-width: 36px; height: 34px; padding: 0 10px; background: var(--tile-2); border: 1px solid var(--seam); color: var(--chalk); cursor: pointer; text-decoration: none; }
.btn:hover { border-color: var(--chalk-3); } .btn.off { opacity: .35; cursor: default; }
.field { background: var(--tile); border: 1px solid var(--seam); color: var(--chalk); padding: 7px 10px; font: inherit; min-height: 36px; }
.linkish { background: none; border: 0; padding: 0; text-decoration: underline; cursor: pointer; color: var(--chalk); }
/* chrome */
.top { position: sticky; top: 0; z-index: 20; background: rgba(19, 20, 22, .96); border-bottom: 1px solid var(--seam); backdrop-filter: blur(6px); }
.bar { max-width: var(--w); margin: 0 auto; padding: 10px 20px; display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
.brand { font: 400 21px var(--stencil); text-decoration: none; letter-spacing: .01em; white-space: nowrap; }
.seg { display: inline-flex; border: 1px solid var(--seam); }
.seg button { background: none; border: 0; padding: 6px 12px; cursor: pointer; color: var(--chalk-2); font-weight: 600; font-size: 13.5px; white-space: nowrap; }
.seg button + button { border-left: 1px solid var(--seam); }
.seg button[aria-pressed="true"] { background: var(--chalk); color: var(--floor); }
.search { position: relative; margin-left: auto; flex: 0 1 300px; }
.search .field { width: 100%; }
#qres { position: absolute; right: 0; top: calc(100% + 4px); width: min(360px, 92vw); background: var(--tile); border: 1px solid var(--seam); padding: 4px; z-index: 30; box-shadow: 0 10px 30px #000a; }
#qres a { display: flex; align-items: center; gap: 8px; padding: 7px 8px; text-decoration: none; }
#qres a:hover { background: var(--tile-2); }
#qres p { margin: 8px; }
nav#nav { max-width: var(--w); margin: 0 auto; padding: 0 20px; display: flex; gap: 22px; overflow-x: auto; scrollbar-width: none; }
nav#nav a { text-decoration: none; color: var(--chalk-2); font-weight: 600; padding: 8px 0 9px; border-bottom: 2px solid transparent; white-space: nowrap; }
nav#nav a[aria-current="page"] { color: var(--chalk); border-color: var(--chalk); }
main { max-width: var(--w); margin: 0 auto; padding: 8px 20px 80px; }
main > *, .sec > *, .panel > * { min-width: 0; }
footer { max-width: var(--w); margin: 0 auto; padding: 0 20px 40px; color: var(--chalk-3); font-size: 13px; }
/* type */
h1 { font: 400 clamp(34px, 6vw, 56px)/1.02 var(--stencil); margin: 18px 0 8px; letter-spacing: .005em; }
h2 { font: 400 24px/1.15 var(--stencil); margin: 0; letter-spacing: .01em; }
h3 { font-size: 16px; margin: 0 0 2px; }
.lede { color: var(--chalk-2); max-width: 760px; font-size: 16.5px; margin: 0 0 14px; }
.sub { color: var(--chalk-2); margin: 4px 0 0; max-width: 780px; font-size: 14px; }
.t3 { color: var(--chalk-3); font-size: 12.5px; }
.sec { margin-top: 46px; }
.sec-head { display: flex; flex-wrap: wrap; align-items: end; gap: 6px 18px; margin-bottom: 14px; }
.sec-head > h2, .sec-head > .sub { flex: 1 1 100%; }
.sec-head .seg, .sec-head .more { margin-top: 4px; }
.more { color: var(--chalk-2); font-weight: 600; font-size: 14px; }
.panel { background: var(--tile); border: 1px solid var(--seam); padding: 14px 16px; }
.two { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; margin-top: 14px; }
.empty { color: var(--chalk-3); }
.prose { max-width: 760px; } .prose p { color: var(--chalk-2); } .prose b { color: var(--chalk); }
/* medals */
svg.md { display: inline-block; vertical-align: middle; flex: none; overflow: visible; }
svg.md text { font: 800 10.5px var(--body); }
.shelf { display: inline-flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; }
.shelf.compact { gap: 3px 8px; }
.sh { display: inline-flex; align-items: center; gap: 3px; font-variant-numeric: tabular-nums; }
.sh b { font-size: 13.5px; min-width: 1ch; }
.sh.zero { opacity: .32; }
.compact .sh b { font-size: 12.5px; }
.mbar { display: block; }
.rest-t { font: 700 10px var(--body); font-style: normal; color: var(--chalk-2); border: 1px solid #59616a; padding: 0 3px; border-radius: 8px; line-height: 14px; }
.tiers { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 12.5px; color: var(--chalk-2); margin-bottom: 6px; }
.tiers i { display: inline-block; width: 12px; height: 12px; margin-right: 6px; vertical-align: -2px; }
.tiers i.line { height: 2px; vertical-align: 3px; background: var(--chalk); }
/* districts and schools */
.dist { display: inline-flex; align-items: center; gap: 7px; white-space: nowrap; max-width: 100%; min-width: 0; }
.dist .dn { overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.dtag { display: inline-grid; place-items: center; width: 36px; height: 20px; border: 1px solid #59616a; font: 700 11.5px var(--body); font-variant-numeric: tabular-nums; letter-spacing: .02em; color: var(--chalk); flex: none; }
.dn { font-weight: 600; }
a.dlink { text-decoration: none; } a.dlink:hover .dn { text-decoration: underline; }
svg.pa { flex: none; } .pa-o { fill: #353c43; } .pa-d { fill: var(--chalk); } .pa-p { fill: var(--chalk); stroke: var(--floor); stroke-width: 1; }
.chip { display: inline-grid; place-items: center; flex: none; border-radius: 50%; overflow: hidden; }
.chip svg { display: block; width: 100%; height: 100%; }
img.chip { object-fit: contain; border-radius: 0; background: none; }
a.who { display: inline-flex; align-items: center; gap: 8px; text-decoration: none; min-width: 0; font-weight: 600; }
a.who span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
a.who:hover span { text-decoration: underline; }
/* tooltip */
#tip { position: fixed; left: 0; top: 0; z-index: 50; pointer-events: none; background: #0c0d0e; border: 1px solid var(--seam); padding: 8px 10px; font-size: 13px; max-width: 300px; box-shadow: 0 8px 24px #000b; }
#tip b { display: block; margin-bottom: 3px; } #tip .tl { display: flex; align-items: center; gap: 6px; }
/* charts */
.ax { font: 500 11px var(--body); fill: var(--chalk-3); } .ax.small { font-size: 10px; }
.grid { stroke: #262b30; } .base { stroke: #4b535b; stroke-width: 1.5; }
.val { font: 700 11.5px var(--body); fill: var(--chalk-2); } .val.hi { fill: var(--chalk); }
.avg { stroke: var(--chalk); stroke-width: 1.5; } .avg-t { fill: var(--chalk-2); font-weight: 600; }
.mc:not(.on) { fill: #202428; } .mc.on { stroke: #0006; stroke-width: .4; }
.mat-rim { fill: #17191b; stroke: #2a2f34; } .mat-axis { stroke: #4b535b; }
.mat-hub { fill: var(--tile); stroke: var(--seam); }
.hub-y { font: 400 30px var(--stencil); fill: var(--chalk); } .hub-s { font: 600 12px var(--body); fill: var(--chalk-2); }
.mat-sel { fill: none; stroke: var(--chalk); stroke-width: 2; }
.strip-sel { fill: none; stroke: var(--chalk); stroke-width: 1.5; }
.mat-host { display: grid; justify-items: center; } .mat-host svg { max-width: 100%; height: auto; touch-action: manipulation; }
/* home */
.hero { padding: 10px 0 4px; }
.key { display: flex; flex-wrap: wrap; gap: 6px 18px; margin-top: 10px; padding: 10px 14px; background: var(--tile); border: 1px solid var(--seam); max-width: 900px; }
.key span { display: inline-flex; align-items: center; gap: 6px; }
.key b { font-size: 13.5px; } .key i { font-style: normal; color: var(--chalk-3); font-size: 12.5px; }
.home-rank { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 28px; align-items: start; }
.hr-mat { position: sticky; top: 110px; }
.pickany { display: grid; gap: 4px; margin-top: 12px; color: var(--chalk-2); font-size: 13px; } .pickany .field { width: 100%; }
.links { margin: 10px 0 0; color: var(--chalk-3); }
.cap-h { display: flex; align-items: center; justify-content: center; gap: 8px; flex-wrap: wrap; margin-bottom: 4px; font-size: 15px; }
.mat-cap { display: grid; justify-items: center; gap: 6px; } .cap-t { color: var(--chalk-3); font-size: 12.5px; }
.defs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin: 0 0 12px; }
.defs > div { background: var(--tile); border: 1px solid var(--seam); padding: 10px 12px; } .defs dt { font-weight: 700; } .defs dd { margin: 2px 0 0; color: var(--chalk-2); font-size: 13px; }
.tr { font-weight: 700; white-space: nowrap; } .tr.up { color: #7fd38f; } .tr.dn { color: #ef8a80; } .tr.flat { color: var(--chalk-3); font-weight: 500; }
svg.spark { display: block; }
.nums dd .tr { font: 700 22px var(--body); }
.chk { display: inline-flex; align-items: center; gap: 6px; color: var(--chalk-2); font-size: 14px; }
.dir { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 6px; }
.dir .letter { grid-column: 1 / -1; font: 400 22px var(--stencil); margin: 14px 0 2px; }
.card { display: grid; grid-template-columns: 30px minmax(0, 1fr); grid-template-areas: "ch nm" "ch sh"; gap: 2px 10px; align-items: center; background: var(--tile); border: 1px solid var(--seam); padding: 9px 12px; text-decoration: none; }
.card:hover { border-color: var(--chalk-3); }
.card .chip { grid-area: ch; } .card .cn { grid-area: nm; display: flex; justify-content: space-between; gap: 8px; min-width: 0; } .card .cn b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.card .cl { display: inline-flex; gap: 4px; flex: none; } .card .shelf { grid-area: sh; }
.ctag { font-size: 10.5px; font-weight: 700; color: var(--chalk-3); border: 1px solid var(--seam); padding: 0 4px; line-height: 18px; } .ctag.on { color: var(--chalk); border-color: #59616a; }
.nowlist { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.nowlist button { width: 100%; display: grid; grid-template-columns: 22px 24px minmax(0, 1fr) auto; grid-template-areas: "rk ch nm sc" "rk ch sh sh"; gap: 0 10px; align-items: center; text-align: left; background: var(--tile); border: 1px solid var(--seam); padding: 8px 12px; cursor: pointer; }
.nowlist button[aria-pressed="true"] { border-color: var(--chalk); background: var(--tile-2); }
.nowlist .rk { grid-area: rk; font: 400 18px var(--stencil); color: var(--chalk-3); }
.nowlist .chip, .nowlist img.chip { grid-area: ch; }
.nowlist .nm { grid-area: nm; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nowlist .sc { grid-area: sc; font: 700 16px var(--body); font-variant-numeric: tabular-nums; }
.nowlist .shelf { grid-area: sh; margin-top: 2px; }
.mat-cap { color: var(--chalk-2); font-size: 13.5px; text-align: center; margin: 8px auto 0; max-width: 520px; }
.mat-cap .shelf { vertical-align: middle; }
.dtable { display: grid; gap: 4px; }
.drow { display: grid; grid-template-columns: minmax(200px, 1.3fr) minmax(190px, 1fr) minmax(0, 1.4fr) 130px; gap: 14px; align-items: center; background: var(--tile); border: 1px solid var(--seam); padding: 8px 14px; text-decoration: none; }
.drow:hover { border-color: var(--chalk-3); }
.drow .mbar { width: 100%; height: 12px; }
.c-p { color: var(--chalk-2); font-size: 13px; text-align: right; } .c-p b { color: var(--chalk); font-size: 15px; }
.smalls { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.small { background: var(--tile); border: 1px solid var(--seam); padding: 10px 12px 6px; text-decoration: none; }
.small:hover { border-color: var(--chalk-3); }
.small-h { margin-bottom: 4px; display: flex; min-width: 0; }
/* team race */
.race-host { padding: 10px 12px; }
.rx-axis { display: grid; grid-template-columns: minmax(150px, 220px) minmax(0, 1fr) 70px; gap: 0 10px; padding: 0 0 6px; border-bottom: 1px solid var(--seam); }
.rx-cols, .rx-strip { display: grid; grid-template-columns: repeat(var(--n), minmax(0, 1fr)); gap: 2px; justify-items: center; }
.rx-axis.d .rx-cols, .rx-grid { grid-template-columns: 16px repeat(var(--n), minmax(0, 1fr)); }
.rx-cols b { font: 700 11px var(--body); color: var(--chalk-2); white-space: nowrap; }
.race { list-style: none; margin: 0; padding: 0; }
.race li { display: grid; grid-template-columns: 26px minmax(124px, 194px) minmax(0, 1fr) 70px; grid-template-areas: "rk nm ax pts"; gap: 0 10px; align-items: center; padding: 6px 0; border-bottom: 1px solid #24292e; }
.race li.hl { background: var(--tile-2); }
.race .rk { grid-area: rk; font: 400 17px var(--stencil); color: var(--chalk-3); text-align: right; }
.race .nm { grid-area: nm; min-width: 0; }
.race .pts { grid-area: pts; text-align: right; color: var(--chalk-2); font-size: 13px; white-space: nowrap; } .race .pts b { color: var(--chalk); font-size: 15px; }
.race .rx-strip, .race .rx-grid { grid-area: ax; }
.rx-strip i, .rx-grid i { font-style: normal; display: grid; place-items: center; width: 100%; height: 22px; }
.rx-strip i.nil::after, .rx-grid i.nil::after { content: ''; width: 4px; height: 4px; border-radius: 50%; background: #2c3237; }
.race.d li { grid-template-areas: "rk nm ax pts" "rk sh ax pts"; align-items: start; padding: 10px 0; }
.race.d .mini { grid-area: sh; margin-top: 6px; }
.rx-grid { display: grid; gap: 1px; align-items: center; }
.rx-grid i { height: 19px; }
/* program page */
.ph { display: flex; gap: 20px; align-items: center; margin: 18px 0 10px; }
.ph h1 { margin: 2px 0 4px; } .ph .crumb { margin: 0; color: var(--chalk-2); }
.ph .about { margin: 0; color: var(--chalk-2); max-width: 720px; }
.ph-mark { flex: none; }
.nums { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; margin: 14px 0 0; }
.nums > div { background: var(--tile); border: 1px solid var(--seam); padding: 10px 14px; display: grid; }
.nums dd { margin: 0; font: 400 28px/1.1 var(--stencil); } .nums dt { font-weight: 700; font-size: 13px; } .nums span { color: var(--chalk-3); font-size: 12.5px; }
.shelf-row { margin: 12px 0 0; padding: 10px 14px; background: var(--tile); border: 1px solid var(--seam); }
.shelf-row .sh b { font-size: 16px; }
.matbox { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(300px, 1fr); gap: 26px; align-items: start; }
.season { background: var(--tile); border: 1px solid var(--seam); padding: 12px 14px; position: sticky; top: 110px; }
.strip-cap { margin: 2px 0 8px; color: var(--chalk-3); font-size: 12px; }
.scrub { display: flex; align-items: center; justify-content: space-between; gap: 10px; border-top: 1px solid var(--seam); padding-top: 10px; }
.scrub span { font: 400 30px var(--stencil); }
.race-line { color: var(--chalk-2); margin: 10px 0 8px; } .race-line b { color: var(--chalk); }
.mlist { list-style: none; margin: 0 0 10px; padding: 0; display: grid; gap: 2px; }
.mlist li { display: grid; grid-template-columns: 24px 38px minmax(0, 1fr) auto; gap: 8px; align-items: center; padding: 4px 0; border-bottom: 1px solid #24292e; }
.mlist .w { font-weight: 700; color: var(--chalk-2); } .mlist .nm { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mlist .who span { max-width: 130px; font-weight: 500; color: var(--chalk-2); }
.lean { color: var(--chalk-2); margin: 0 0 10px; } .lean b { color: var(--chalk); }
.bars { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.bars li { display: grid; grid-template-columns: minmax(150px, 220px) minmax(0, 1fr) 40px; gap: 10px; align-items: center; }
.bars .track { height: 12px; background: #24292e; } .bars .track i { display: block; height: 100%; background: var(--chalk-2); }
.bars b { text-align: right; }
/* tables */
.tools { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 10px; }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
th { text-align: left; color: var(--chalk-3); font-size: 12px; font-weight: 600; padding: 6px 8px; border-bottom: 1px solid var(--seam); white-space: nowrap; }
th button { background: none; border: 0; padding: 0; cursor: pointer; color: inherit; font-weight: 600; }
th button[aria-pressed="true"] { color: var(--chalk); }
td { padding: 7px 8px; border-bottom: 1px solid #24292e; vertical-align: middle; }
th.n, td.n { text-align: right; }
td.rk { color: var(--chalk-3); font-weight: 700; }
td.nm { min-width: 0; } td.nm .who { max-width: 240px; } .nmw { display: inline-flex; align-items: center; gap: 8px; max-width: 100%; }
td.nm .dist { gap: 6px; }
.rt { overflow-x: auto; }
.more-btn { margin-top: 10px; }
.method { margin: 0 0 16px; color: var(--chalk-2); max-width: 820px; } .method summary { cursor: pointer; color: var(--chalk); font-weight: 600; }
table.wr td.nm b { display: block; } .yrs { color: var(--chalk-3); font-size: 12.5px; }
.career { display: inline-flex; gap: 3px; flex-wrap: wrap; }
.show-m { display: none; }
/* season */
.season-head .yr-nav { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.season-head h1 { margin: 10px 0; }
.finals { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.finals li { display: grid; grid-template-columns: 50px minmax(0, 1fr) minmax(0, 1fr); gap: 12px; align-items: center; background: var(--tile); border: 1px solid var(--seam); padding: 8px 12px; }
.finals .w { font: 400 20px var(--stencil); }
.finals .f1, .finals .f2 { display: flex; gap: 10px; align-items: center; min-width: 0; }
.finals .f1 > span, .finals .f2 > span { display: grid; min-width: 0; }
.finals .f1 b, .finals .f2 b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.finals .who { font-weight: 500; color: var(--chalk-2); font-size: 13px; }
/* records */
.rec { list-style: none; margin: 10px 0 0; padding: 0; display: grid; gap: 2px; }
.rec li { display: grid; grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: "who n" "yr yr"; gap: 0 10px; padding: 6px 0; border-bottom: 1px solid #24292e; }
.rec .who { grid-area: who; } .rec > li > b { grid-area: n; font-size: 16px; } .rec .yrs { grid-area: yr; margin-left: 28px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
/* home */
.statemap { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(280px, 1fr); gap: 22px; align-items: start; margin-top: 12px; }
.map-host svg { width: 100%; height: auto; display: block; }
.pa-dist:hover { filter: brightness(1.12); }
.pa-lab { font-family: var(--body); font-weight: 800; letter-spacing: .02em; }
.dcard { background: var(--tile); border: 1px solid var(--seam); padding: 14px 16px; display: grid; gap: 8px; }
.dc-h { display: flex; gap: 12px; align-items: center; } .dc-h p { margin: 0; } .dc-h h3 { font-size: 18px; }
.dc-n { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin: 0; } .dc-n div { background: var(--tile-2); padding: 6px 8px; } .dc-n dd { margin: 0; font: 700 18px var(--body); } .dc-n dt { color: var(--chalk-3); font-size: 12px; }
.dc-l { margin: 4px 0 0; color: var(--chalk-3); font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; }
.dc-p { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; } .dc-p li { display: flex; justify-content: space-between; gap: 8px; } .dc-w { margin: 0; }
.panel.tight { padding: 4px 12px; }
.wtab td { vertical-align: middle; } .wtab .idx { color: var(--chalk-2); font-size: 12.5px; white-space: nowrap; } .wlink { font: 400 18px var(--stencil); text-decoration: none; }
.career.sm { display: inline-flex; gap: 2px; vertical-align: middle; }
a.wname { font-weight: 700; text-decoration: none; } a.wname:hover { text-decoration: underline; }
/* weights */
.wchips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: thin; }
.wchips a { flex: none; min-width: 52px; text-align: center; padding: 8px 10px; background: var(--tile); border: 1px solid var(--seam); text-decoration: none; font: 400 17px var(--stencil); }
.wchips a[aria-current="true"] { background: var(--chalk); color: var(--floor); border-color: var(--chalk); }
.whead { margin: 18px 0 0; } .whead p { margin: 2px 0 0; }
