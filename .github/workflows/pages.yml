# Publishes the Overtime app (overtime/) to GitHub Pages on every push to rebuild.
# One-time setup in repo Settings: Pages > Source = "GitHub Actions", and
# Environments > github-pages > allow branch "rebuild".
name: Publish website
on:
  push:
    branches: [rebuild]
    paths: ['overtime/**', 'tools/build_pages.py', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  # Build and upload in one job, deploy in the next (GitHub's starter layout). With both steps in one job,
  # deploy-pages sometimes asks for the artifact a second after the upload, before GitHub lists it, and fails with
  # "No artifacts named github-pages" (it did on 2026-11-21). The per-attempt name keeps a re-run from finding two.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
      - name: Build site from overtime/
        run: python3 tools/build_pages.py _site "${GITHUB_SHA::8}"
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
          name: github-pages-${{ github.run_attempt }}
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
