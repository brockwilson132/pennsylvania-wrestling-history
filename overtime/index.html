<!-- boot loader: "the districts". Pennsylvania's PIAA districts fly in from all sides, each with its number, and lock
     together into the state. The seams glow and fade, OVERTIME drops in letter by letter, the tagline follows, and on
     exit the districts burst apart to show the app. It leaves at the later of: the intro being done, and the app's
     first render (or OTBoot.hide()), so it never ends before the app is ready and never makes a slow load slower.
     Only transform/opacity animate, so it stays smooth while the data scripts block the main thread.
     Once both are true the bar gives way to an "Enter the stadium" button (Brock): the loader waits for it or the Enter key,
     and an Enter pressed early is kept until the app is ready. Music: intro-audio.js synthesises original stadium loops
     (no recordings, so nothing licensed on the public site); browsers allow sound only after a tap or key, so it starts on
     the first one, and Enter lands a hit and fades it out. The speaker toggle is remembered. Reduced motion: plain fades. -->
