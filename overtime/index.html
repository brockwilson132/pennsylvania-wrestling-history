<!-- boot loader. A ~1.9 s intro (state, then OVERTIME letter by letter, then the tagline, then a glint), then the
     loader zooms and fades into the app. It leaves at the later of: the intro being done, and the app's first render
     (or OTBoot.hide()), so it never ends before the app is ready and never makes a slow load slower.
     Every moving part is an HTML layer animated only with transform/opacity, so the compositor keeps it smooth while
     the data scripts below block the main thread. The letters' dark cut is a static state-shaped mask, so the border
     cut stays put while the letters rise through it. Tap/click/key skips the rest once the app is ready.
     Reduced motion: no movement, a plain fade in and out. -->
<style>
#otboot{position:fixed;inset:0;z-index:999;display:grid;place-items:center;background:#0B0D10;color:#EEEAE1;pointer-events:auto}
#otboot .w{display:grid;justify-items:center;gap:22px}
#otboot .lk{position:relative;width:min(520px,88vw);aspect-ratio:583/241}
#otboot .lk>*,#otboot .lk .m>*{position:absolute;inset:0}
#otboot .lk svg{width:100%;height:100%;overflow:visible;display:block}
#otboot .m{-webkit-mask:var(--pa) 0 0/100% 100% no-repeat;mask:var(--pa) 0 0/100% 100% no-repeat}
#otboot .a{will-change:transform,opacity;animation:var(--k) var(--d,.6s) var(--e,cubic-bezier(.16,1,.3,1)) var(--t,0s) both;animation-play-state:paused}
#otboot.go .a{animation-play-state:running}
#otboot .st{--k:otb-st;--d:.75s;--t:.05s}
#otboot .ch{--k:otb-ch;--d:.55s;--e:cubic-bezier(.22,1.3,.36,1)}
#otboot .tg{--k:otb-tg;--d:.6s}
#otboot .gl{--k:otb-gl;--d:.7s;--t:1.3s;--e:cubic-bezier(.45,0,.55,1);background:linear-gradient(100deg,transparent 38%,rgba(255,255,255,.55) 50%,transparent 62%)}
#otboot .lo{display:grid;justify-items:center;gap:22px;--k:otb-fd;--d:.5s;--t:.8s}
#otboot .bar{width:min(220px,60vw);height:6px;border-radius:3px;background:#262C35;overflow:hidden}
#otboot .bar b,#otboot .bar i{display:block;height:100%;transform:translateX(-100%);will-change:transform}
#otboot .bar b{overflow:hidden}
#otboot .bar i{position:relative;overflow:hidden;transform:translateX(100%);background:linear-gradient(90deg,#2C5BD8,#20A8D8 20%,#2EC27E 42%,#E5C53A 62%,#F08A24 80%,#E8392B)}
#otboot .bar i::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.45),transparent);transform:translateX(-100%);animation:otb-sh 1.3s 1s ease-in-out infinite}
#otboot .msg{font:600 12px/1 system-ui,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:#8A939E;min-height:12px}
#otboot.out{pointer-events:none;animation:otb-out .5s .05s cubic-bezier(.4,0,.2,1) both}
#otboot.out .w{animation:otb-zoom .45s cubic-bezier(.4,0,1,1) both}
@keyframes otb-st{from{opacity:0;transform:translateY(14px) scale(.92)}}
@keyframes otb-ch{from{opacity:0;transform:translateY(16%)}}
@keyframes otb-tg{from{opacity:0;transform:translateY(10px)}}
@keyframes otb-fd{from{opacity:0}}
@keyframes otb-gl{from{transform:translateX(-70%)}to{transform:translateX(70%)}}
@keyframes otb-sh{to{transform:translateX(100%)}}
@keyframes otb-out{to{opacity:0}}
@keyframes otb-zoom{70%{opacity:0}to{transform:scale(1.1);opacity:0}}
@media (prefers-reduced-motion:reduce){
  #otboot .a{animation:otb-fd .4s ease-out both;animation-play-state:paused}
  #otboot .gl,#otboot .bar i::after{display:none}
  #otboot.out{animation:otb-out .3s ease-out both}#otboot.out .w{animation:none}
}
</style>
